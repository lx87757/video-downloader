name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 使用 Buildozer 打包 APK
        uses: Artemis-Skade/buildozer-action@v1
        with:
          command: buildozer -s android debug
          subfolder: .

      - name: 上传 APK 安装包
        uses: actions/upload-artifact@v3
        with:
          name: VideoDownloader-APK
          path: bin/*.apk
